<!doctype html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css?family=Dosis:400,700" rel="stylesheet">
    <script>
        var players = [];
        // Hides rows through CSS, so it also applies to results already shown.
        function setFilter(value){
            document.getElementById('root').dataset.filter = value;
        }
        function setWishlist(on){
            document.getElementById('root').dataset.wishlist = on ? "on" : "off";
        }
        // The Add Player box takes a SteamID64, a profile link, a custom URL
        // name or a display name. Exact matches are added straight away;
        // otherwise the matches are listed to pick from.
        function getPlayers(){
            event.preventDefault();
            const query = document.players.player.value.trim();
            const picker = document.getElementById('playerPicker');
            if (query == "") {
                return false;
            }
            picker.textContent = "Searching...";
            var xhttp = new XMLHttpRequest();
            xhttp.open("POST",'/steamcompare/search', true);
            xhttp.setRequestHeader("Content-Type","application/json");
            xhttp.onload = function(){
                picker.textContent = "";
                if (xhttp.status != 200){
                    picker.textContent = "Search failed, try again.";
                    return;
                }
                const data = JSON.parse(xhttp.responseText);
                if (data.results.length == 0){
                    picker.textContent = 'No players found for "' + query + '".';
                }
                else if (data.exact){
                    addPlayer(data.results[0]);
                    document.players.player.value = "";
                }
                else {
                    data.results.forEach(function(result){
                        const row = document.createElement('div');
                        row.setAttribute('class', 'pickerRow');
                        const avatar = document.createElement('img');
                        avatar.setAttribute('src', result.avatarURI);
                        avatar.setAttribute('height', 40);
                        avatar.setAttribute('width', 40);
                        const text = document.createElement('div');
                        const name = document.createElement('div');
                        name.setAttribute('class', 'pickerName');
                        name.textContent = result.name;
                        const details = document.createElement('div');
                        details.setAttribute('class', 'pickerDetails');
                        details.textContent = result.details || "";
                        text.appendChild(name);
                        text.appendChild(details);
                        const profile = document.createElement('a');
                        profile.setAttribute('href', result.profileURI);
                        profile.setAttribute('target', '_blank');
                        profile.setAttribute('rel', 'noopener');
                        profile.textContent = "Profile";
                        const add = document.createElement('button');
                        add.setAttribute('type', 'button');
                        add.textContent = "Add";
                        add.onclick = function(){
                            addPlayer(result);
                            picker.textContent = "";
                            document.players.player.value = "";
                        };
                        row.appendChild(add);
                        row.appendChild(avatar);
                        row.appendChild(text);
                        row.appendChild(profile);
                        picker.appendChild(row);
                    });
                }
            }
            xhttp.send(JSON.stringify({"query": query}));
            return false;
        }
        // player: {steamid, name, avatarURI}
        function addPlayer(player){
            if (players.indexOf(player.steamid) > -1){
                return;
            }
            const app = document.getElementById('root');
            var playerContainerExists = document.getElementById("playerContainer");
            if (playerContainerExists == null){
                container = document.createElement('div');
                container.setAttribute("class","playerContainer");
                container.setAttribute("id","playerContainer");
                app.appendChild(container);
            }
            else {
                container = playerContainerExists;
            }
            playerRow = document.createElement('div');
            playerRow.setAttribute('class','playerRow');
            playerInfo = document.createElement('div');
            playerInfo.setAttribute("class","playerName");
            playerImageCell = document.createElement('div');
            playerImageCell.setAttribute("class","playerImage");
            playerImage = document.createElement("img");
            playerRow.appendChild(playerImageCell);
            playerRow.appendChild(playerInfo);
            container.appendChild(playerRow);
            playerImageCell.appendChild(playerImage);
            const playerName = document.createElement('div');
            playerName.textContent = player.name;
            const playerStatus = document.createElement('div');
            playerStatus.setAttribute('class', 'playerStatus');
            playerStatus.textContent = "Checking privacy...";
            playerInfo.appendChild(playerName);
            playerInfo.appendChild(playerStatus);
            playerImage.setAttribute("src",player.avatarURI);
            playerImage.setAttribute("height", 64);
            playerImage.setAttribute("width", 64);
            players.push(player.steamid);
            console.log(players);
            checkPlayerStatus(player.steamid, playerStatus);
        }
        // Shows whether the player's games and wishlist are public. Wishlists
        // follow Steam's "Game details" privacy setting.
        function checkPlayerStatus(steamid, statusDiv){
            var xhttp = new XMLHttpRequest();
            xhttp.open("POST", "/steamcompare/playerstatus", true);
            xhttp.setRequestHeader("Content-Type","application/json");
            xhttp.onload = function(){
                if (xhttp.status != 200){
                    statusDiv.textContent = "Couldn't check privacy.";
                    return;
                }
                const s = JSON.parse(xhttp.responseText);
                statusDiv.textContent = "";
                if (s.games_public === false){
                    statusDiv.classList.add("private");
                    statusDiv.appendChild(document.createTextNode("Games and wishlist are private. "));
                    const fix = document.createElement('a');
                    fix.setAttribute('href', 'https://steamcommunity.com/profiles/' + steamid + '/edit/settings');
                    fix.setAttribute('target', '_blank');
                    fix.setAttribute('rel', 'noopener');
                    fix.textContent = "Set Game details to Public";
                    statusDiv.appendChild(fix);
                }
                else if (s.games_public === true){
                    const games = s.game_count + " games";
                    const wishlist = s.wishlist_count > 0
                        ? "wishlist: " + s.wishlist_count + " games"
                        : "wishlist: public, empty";
                    statusDiv.textContent = games + ", " + wishlist;
                }
                else {
                    statusDiv.textContent = "Couldn't check privacy.";
                }
            };
            xhttp.onerror = function(){ statusDiv.textContent = "Couldn't check privacy."; };
            xhttp.send(JSON.stringify({"steamid": steamid}));
        }
        function setComparing(running, message){
            document.getElementById('compareButton').disabled = running;
            document.getElementById('spinner').style.display = running ? "inline-block" : "none";
            document.getElementById('compareMessage').textContent = message;
        }
        function handleClick() {
            event.preventDefault();
            payload = JSON.stringify({"players":players,"wishlist":"True"});
            const app = document.getElementById('root');
            const container = document.createElement('div');
            container.setAttribute('class', 'gamesContainer');
            app.appendChild(container);
            var xhttp = new XMLHttpRequest();
            xhttp.open("POST","/steamcompare/full", true);
            xhttp.setRequestHeader("Content-Type","application/json");
            setComparing(true, "Comparing libraries... new games are looked up on Steam, so this can take a few minutes.");
            xhttp.onerror = function(){
                setComparing(false, "The compare failed: couldn't reach the server.");
            };
            xhttp.onload = function(){
                console.log("Got Return!");
                if (xhttp.status != 200){
                    setComparing(false, "The compare failed (HTTP " + xhttp.status + "). Try again in a few minutes.");
                    return;
                }
                var gameReturn = JSON.parse(xhttp.responseText);
                // errors: [{steamid: message}], e.g. a player whose game details are private.
                const problems = [];
                gameReturn.errors.forEach(function(e){
                    Object.values(e).forEach(function(message){ problems.push(message); });
                });
                setComparing(false, problems.join(" "));
                gameReturn.games.forEach(function(game){
                    console.log(game.name);
                    var numPlayers = 0;
                    numPlayers = game.users.length;
                    game.numUsers = numPlayers;
                })
                gameReturn.games.sort((a,b) => parseFloat(b.numUsers) - parseFloat(a.numUsers));
                gameReturn.games.forEach(function(game){
                    var multiplayer = [];
                    const gameRow = document.createElement('div');
                    gameRow.setAttribute('class', 'gameRowSP');
                    const h3 = document.createElement('h3');
                    container.appendChild(gameRow);
                    imgDiv = document.createElement('div');
                    imgDiv.setAttribute('class','gameImage');
                    gameRow.appendChild(imgDiv);
                    const storeLink = document.createElement('a');
                    storeLink.setAttribute('href', 'https://store.steampowered.com/app/' + game.appid);
                    storeLink.setAttribute('target', '_blank');
                    storeLink.setAttribute('rel', 'noopener');
                    storeLink.setAttribute('title', game.name + ' on Steam');
                    img = document.createElement('img');
                    img.setAttribute('src',game.thumbnail);
                    img.setAttribute('alt',game.name);
                    storeLink.appendChild(img);
                    imgDiv.appendChild(storeLink);
                    userContainer = document.createElement('div');
                    userContainer.setAttribute('class','userContainer');
                    game.users.forEach(function(user){
                        console.log("hi")
                        userDiv = document.createElement('div');
                        userDiv.setAttribute('class','playerImage')
                        gameRow.append(userDiv);
                        const userImg = document.createElement('img');
                        userImg.setAttribute('src',user.avatarURI);
                        userImg.setAttribute('height','65px');
                        userImg.setAttribute('width','65px');
                        userDiv.appendChild(userImg);
                        userContainer.appendChild(userDiv);
                    });
                    gameRow.appendChild(userContainer);
                    if (game.multi.indexOf("coop") > -1){
                        gameRow.setAttribute("class", "gameRowCOOP")
                    }
                    else if (game.multi.indexOf("multiplayer") > -1){
                        gameRow.setAttribute("class", "gameRowMP")
                    };
                    // Wishlisted games only one player has are hidden unless the toggle is on.
                    if (game.users.length < 2){
                        gameRow.classList.add("notShared");
                    }
                    // game.wishlist lists the players who have it on their wishlist.
                    if (game.wishlist && game.wishlist.length > 0){
                        gameRow.classList.add("wishlisted");
                        const wishDiv = document.createElement('div');
                        wishDiv.setAttribute('class', 'wishlistInfo');
                        const who = document.createElement('div');
                        who.textContent = "On wishlist: " + game.wishlist.map(p => p.name).join(", ");
                        const price = document.createElement('div');
                        price.setAttribute('class', 'price');
                        if (game.price){
                            price.textContent = game.price.final;
                            if (game.price.discount_percent > 0){
                                price.textContent = "-" + game.price.discount_percent + "% " + game.price.final
                                    + " (was " + game.price.initial + ")";
                            }
                        } else if (game.is_free){
                            price.textContent = "Free";
                        } else {
                            price.textContent = "No price listed";
                        }
                        wishDiv.appendChild(who);
                        if (game.owners && game.owners.length > 0){
                            const owners = document.createElement('div');
                            owners.textContent = "Owned by: " + game.owners.map(p => p.name).join(", ");
                            wishDiv.appendChild(owners);
                        }
                        wishDiv.appendChild(price);
                        gameRow.appendChild(wishDiv);
                    }
                })
            }
            xhttp.send(payload)
            return false; // prevent further bubbling of event
          }
    </script>
    <style>

.gamesContainer {
  display: flex;
  flex-direction: column;
  padding: 2pc;
}

.playerContainer{
  display: flex;
  flex-direction: column;
}
.gameImage{
    width: 292px;
    height: 136px;
}
.playerRow {
  background-color: darkgrey;
  width: 25pc;
  display: flex;
  flex-direction: row;
  align-items: center;
}
.playerRow:nth-child(odd){
    background-color:dimgrey;
}
.playerImage{
  height: 65px;
  padding: 1px;
}
.playerName{
  vertical-align: center;
}
.playerStatus {
  font-size: 0.85em;
}
.playerStatus.private {
  color: darkred;
  font-weight: bold;
}
.spinner {
  display: none;
  width: 16px;
  height: 16px;
  margin: 0 0.5pc;
  vertical-align: middle;
  border: 3px solid lightgrey;
  border-top-color: darkslateblue;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#playerPicker {
  max-height: 24pc;
  overflow-y: auto;
  width: 32pc;
  margin: 0.5pc 0;
}
.pickerRow {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.6pc;
  padding: 3px;
  background-color: darkgrey;
}
.pickerRow:nth-child(odd) {
  background-color: dimgrey;
}
.pickerRow > div {
  flex: 1;
}
.pickerName {
  font-weight: bold;
}
.pickerDetails {
  font-size: 0.85em;
}
.userContainer{
    display: flex;
    flex-direction: column;
    flex-flow: column wrap;
}
.gameRowSP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkgrey;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowMP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkslateblue;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowCOOP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkolivegreen;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowSP:nth-child(odd){
    background-color:dimgrey;
}

.filters {
    margin: 0.5pc 0;
}
.filters label {
    margin-left: 1pc;
}
.filters .toggle {
    margin-left: 2pc;
}
/* Coop Only: green rows. Competitive Multiplayer: blue/purple rows. */
#root[data-filter="coop"] .gameRowMP,
#root[data-filter="coop"] .gameRowSP,
#root[data-filter="mp"] .gameRowCOOP,
#root[data-filter="mp"] .gameRowSP,
#root[data-wishlist="off"] .gamesContainer > div.notShared,
#root[data-wishlist="on"] .gamesContainer > div:not(.wishlisted) {
    display: none;
}
.wishlistInfo {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 1pc;
}
.price {
    font-size: 1.4em;
    font-weight: bold;
}


</style>
</head>
    <body>
    
    <form name="players" onSubmit="return getPlayers()">
         Player:
         <input type="text" name="player" size="40" placeholder="Name, custom URL, profile link or Steam ID" />
         <input name="Submit" type="submit" value="Add Player" />
    </form>
    <div id="playerPicker"></div>
    <form name="yourForm" onSubmit="return handleClick()">
            <input name="Submit" id="compareButton" type="submit" value="Compare Libraries" />
            <span id="spinner" class="spinner" role="status" aria-label="Comparing"></span>
            <span id="compareMessage"></span>
        </form>
    <div class="filters">
        Show:
        <label><input type="radio" name="gameFilter" value="all" checked onchange="setFilter(this.value)" /> All games</label>
        <label><input type="radio" name="gameFilter" value="coop" onchange="setFilter(this.value)" /> Coop Only</label>
        <label><input type="radio" name="gameFilter" value="mp" onchange="setFilter(this.value)" /> Competitive Multiplayer</label>
        <label class="toggle"><input type="checkbox" name="wishlistToggle" onchange="setWishlist(this.checked)" /> Wishlist Games</label>
    </div>
    <div id="root" data-filter="all" data-wishlist="off"></div>
    </body>
    </html>
