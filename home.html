<!doctype html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css?family=Dosis:400,700" rel="stylesheet">
    <script>
        var players = [];
        // Hides rows through CSS, so it also applies to results already shown.
        function setFilter(value){
            document.getElementById('root').dataset.filter = value;
        }
        function setWishlist(on){
            document.getElementById('root').dataset.wishlist = on ? "on" : "off";
        }
        function getPlayers(){
            event.preventDefault();
            playerId = document.players.player.value;
            payload = JSON.stringify({"players":[playerId]})
            var xhttp = new XMLHttpRequest();
            xhttp.open("POST",'/steamcompare/steamuserlookup', true);
            xhttp.setRequestHeader("Content-Type","application/json");
            xhttp.onload = function(){
                playerDataRaw = JSON.parse(xhttp.responseText);
                const app = document.getElementById('root');
                var playerContainerExists = document.getElementById("playerContainer");
                if (playerContainerExists == null){
                    container = document.createElement('div');
                    container.setAttribute("class","playerContainer");
                    container.setAttribute("id","playerContainer");
                    app.appendChild(container);
                }
                else {
                    container = playerContainerExists;
                }
                playerRow = document.createElement('div');
                playerRow.setAttribute('class','playerRow');
                playerInfo = document.createElement('div');
                playerInfo.setAttribute("class","playerName");
                playerImageCell = document.createElement('div');
                playerImageCell.setAttribute("class","playerImage");
                playerImage = document.createElement("img");
                playerRow.appendChild(playerImageCell);
                playerRow.appendChild(playerInfo);
                container.appendChild(playerRow);
                playerImageCell.appendChild(playerImage);
                playerInfo.textContent = playerDataRaw.players[0].name;
                playerImage.setAttribute("src",playerDataRaw.players[0].avatarURI);
                playerImage.setAttribute("height", 64);
                playerImage.setAttribute("width", 64);
                players.push(playerDataRaw.players[0].steamid);
                console.log(players);
            }
            xhttp.send(payload)         
        }
        function handleClick() {
            event.preventDefault();
            payload = JSON.stringify({"players":players,"wishlist":"True"});
            const app = document.getElementById('root');
            const container = document.createElement('div');
            container.setAttribute('class', 'gamesContainer');
            app.appendChild(container);
            var xhttp = new XMLHttpRequest();
            xhttp.open("POST","/steamcompare/full", true);
            xhttp.setRequestHeader("Content-Type","application/json");
            xhttp.onload = function(){
                console.log("Got Return!");
                var gameReturn = JSON.parse(xhttp.responseText);
                gameReturn.games.forEach(function(game){
                    console.log(game.name);
                    var numPlayers = 0;
                    numPlayers = game.users.length;
                    game.numUsers = numPlayers;
                })
                gameReturn.games.sort((a,b) => parseFloat(b.numUsers) - parseFloat(a.numUsers));
                gameReturn.games.forEach(function(game){
                    var multiplayer = [];
                    const gameRow = document.createElement('div');
                    gameRow.setAttribute('class', 'gameRowSP');
                    const h3 = document.createElement('h3');
                    container.appendChild(gameRow);
                    imgDiv = document.createElement('div');
                    imgDiv.setAttribute('class','gameImage');
                    gameRow.appendChild(imgDiv);
                    const storeLink = document.createElement('a');
                    storeLink.setAttribute('href', 'https://store.steampowered.com/app/' + game.appid);
                    storeLink.setAttribute('target', '_blank');
                    storeLink.setAttribute('rel', 'noopener');
                    storeLink.setAttribute('title', game.name + ' on Steam');
                    img = document.createElement('img');
                    img.setAttribute('src',game.thumbnail);
                    img.setAttribute('alt',game.name);
                    storeLink.appendChild(img);
                    imgDiv.appendChild(storeLink);
                    userContainer = document.createElement('div');
                    userContainer.setAttribute('class','userContainer');
                    game.users.forEach(function(user){
                        console.log("hi")
                        userDiv = document.createElement('div');
                        userDiv.setAttribute('class','playerImage')
                        gameRow.append(userDiv);
                        const userImg = document.createElement('img');
                        userImg.setAttribute('src',user.avatarURI);
                        userImg.setAttribute('height','65px');
                        userImg.setAttribute('width','65px');
                        userDiv.appendChild(userImg);
                        userContainer.appendChild(userDiv);
                    });
                    gameRow.appendChild(userContainer);
                    if (game.multi.indexOf("coop") > -1){
                        gameRow.setAttribute("class", "gameRowCOOP")
                    }
                    else if (game.multi.indexOf("multiplayer") > -1){
                        gameRow.setAttribute("class", "gameRowMP")
                    };
                    // Wishlisted games only one player has are hidden unless the toggle is on.
                    if (game.users.length < 2){
                        gameRow.classList.add("notShared");
                    }
                    // game.wishlist lists the players who have it on their wishlist.
                    if (game.wishlist && game.wishlist.length > 0){
                        gameRow.classList.add("wishlisted");
                        const wishDiv = document.createElement('div');
                        wishDiv.setAttribute('class', 'wishlistInfo');
                        const who = document.createElement('div');
                        who.textContent = "On wishlist: " + game.wishlist.map(p => p.name).join(", ");
                        const price = document.createElement('div');
                        price.setAttribute('class', 'price');
                        if (game.price){
                            price.textContent = game.price.final;
                            if (game.price.discount_percent > 0){
                                price.textContent = "-" + game.price.discount_percent + "% " + game.price.final
                                    + " (was " + game.price.initial + ")";
                            }
                        } else if (game.is_free){
                            price.textContent = "Free";
                        } else {
                            price.textContent = "No price listed";
                        }
                        wishDiv.appendChild(who);
                        if (game.owners && game.owners.length > 0){
                            const owners = document.createElement('div');
                            owners.textContent = "Owned by: " + game.owners.map(p => p.name).join(", ");
                            wishDiv.appendChild(owners);
                        }
                        wishDiv.appendChild(price);
                        gameRow.appendChild(wishDiv);
                    }
                })
            }
            xhttp.send(payload)
            return false; // prevent further bubbling of event
          }
    </script>
    <style>

.gamesContainer {
  display: flex;
  flex-direction: column;
  padding: 2pc;
}

.playerContainer{
  display: flex;
  flex-direction: column;
}
.gameImage{
    width: 292px;
    height: 136px;
}
.playerRow {
  background-color: darkgrey;
  width: 25pc;
  display: flex;
  flex-direction: row;
  align-items: center;
}
.playerRow:nth-child(odd){
    background-color:dimgrey;
}
.playerImage{
  height: 65px;
  padding: 1px;
}
.playerName{
  vertical-align: center;
}
.userContainer{
    display: flex;
    flex-direction: column;
    flex-flow: column wrap;
}
.gameRowSP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkgrey;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowMP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkslateblue;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowCOOP {
    display: flex;
    flex-direction: row;
    border: 1px solid black;
    background-color: darkolivegreen;
    height: 140px;
    width: 100%;
    width: 100vw;
    padding-bottom: 5px;
    padding-top: 5px;
}
.gameRowSP:nth-child(odd){
    background-color:dimgrey;
}

.filters {
    margin: 0.5pc 0;
}
.filters label {
    margin-left: 1pc;
}
.filters .toggle {
    margin-left: 2pc;
}
/* Coop Only: green rows. Competitive Multiplayer: blue/purple rows. */
#root[data-filter="coop"] .gameRowMP,
#root[data-filter="coop"] .gameRowSP,
#root[data-filter="mp"] .gameRowCOOP,
#root[data-filter="mp"] .gameRowSP,
#root[data-wishlist="off"] .gamesContainer > div.notShared,
#root[data-wishlist="on"] .gamesContainer > div:not(.wishlisted) {
    display: none;
}
.wishlistInfo {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 1pc;
}
.price {
    font-size: 1.4em;
    font-weight: bold;
}


</style>
</head>
    <body>
    
    <form name="players" onSubmit="return getPlayers()">
         Player id:
         <input type="text" name="player" />
         <input name="Submit" type="submit" value="Add Player" />
    </form>
    <form name="yourForm" onSubmit="return handleClick()">
            <input name="Submit"  type="submit" value="Compare Libraries" />
        </form>
    <div class="filters">
        Show:
        <label><input type="radio" name="gameFilter" value="all" checked onchange="setFilter(this.value)" /> All games</label>
        <label><input type="radio" name="gameFilter" value="coop" onchange="setFilter(this.value)" /> Coop Only</label>
        <label><input type="radio" name="gameFilter" value="mp" onchange="setFilter(this.value)" /> Competitive Multiplayer</label>
        <label class="toggle"><input type="checkbox" name="wishlistToggle" onchange="setWishlist(this.checked)" /> Wishlist Games</label>
    </div>
    <div id="root" data-filter="all" data-wishlist="off"></div>
    </body>
    </html>
